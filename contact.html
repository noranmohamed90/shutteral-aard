<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="تواصل مع العارض للشتر للاستفسار عن منتجات الشتر وطلب عرض سعر أو معرفة الحل المناسب لاحتياجاتك. فريقنا جاهز للرد على استفساراتك وتقديم المساعدة.">

    <meta name="robots" content="index, follow">


    <meta property="og:title" content="تواصل معنا | العارض للشتر">

    <meta property="og:description"
        content="تواصل مع العارض للشتر للاستفسار عن منتجات الشتر وطلب عرض سعر ومعرفة الحل المناسب لاحتياجاتك.">

    <meta property="og:type" content="website">
    <link rel="canonical" href="https://shutteral-aard.com/contact.html">

    <meta property="og:image"
        content="https://shutteral-aard.com/images/hero2.jpg">

    <meta property="og:url"
        content="https://shutteral-aard.com/contact.html">

    <meta property="og:locale" content="ar_SA">

    <title>تواصل معنا | العارض للشتر</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="shortcut icon" href="./images/favicon.ico" type="image/x-icon">
</head>



<body>
    <!------headerStart-->
    <div id="header-placeholder"></div>
    <!------headerEnd-->
    <!------mainStart-->
    <main>

        <section class="contact-main">


            <div class="contact-form">

                <h1>تواصل معنا</h1>

                <p>
                    لديك استفسار أو ترغب في معرفة المزيد عن منتجاتنا؟
                    أرسل لنا رسالتك وسنتواصل معك في أقرب وقت.
                </p>

                <form id="contactForm" action="https://formspree.io/f/mvkpqqwa" method="POST">

                    <div class="form-group">

                        <label for="name">الاسم</label>

                        <input type="text" id="name" name="name" placeholder="اكتب اسمك" required>

                    </div>

                    <div class="form-group">

                        <label for="phone">رقم الهاتف</label>

                        <input type="tel" id="phone" name="phone" placeholder=" اكتب رقم الهاتف" required>

                    </div>


                    <div class="form-group">

                        <label for="email">البريد الإلكتروني</label>

                        <input type="email" id="email" name="email" placeholder="example@email.com">

                    </div>

                    <div class="form-group">

                        <label for="message">الرسالة</label>

                        <textarea id="message" name="message" rows="5" placeholder="اكتب رسالتك هنا..."
                            required></textarea>

                    </div>


                    <button type="submit" class="contact-btn">
                        إرسال الرسالة
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>

                </form>

            </div>


            <!-- Google Map -->

            <div class="contact-map">

                <h2>موقعنا</h2>

                <p>
                    يمكنك العثور علينا من خلال الخريطة التالية.
                </p>

                <div class="map-container">



                    <iframe
                        src= "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3625.723519998395!2d46.72555359678955!3d24.6676433!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e2f05a38c37f653%3A0xba0ffacbeacf902b!2s14%20Swalahudheen%20Ayyyobi%20Bus%20Station!5e0!3m2!1sen!2seg!4v1786390584896!5m2!1sen!2seg" 
                        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                        referrerpolicy="strict-origin-when-cross-origin"
                            title="موقع العارض للشتر في الرياض"></iframe>

                    </iframe>

                </div>

            </div>

        </section>


        <!-- Bottom CTA -->

        <section class="contact-cta">

            <h2>هل لديك مشروع؟</h2>

            <p>
                تواصل معنا الآن ودعنا نساعدك في اختيار
                الحل المناسب لاحتياجاتك.
            </p>

            <a href="https://wa.me/9660508785970" target="_blank" rel="noopener noreferrer">
                تواصل معنا الآن
                <i class="fa-solid fa-arrow-left"></i>
            </a>

        </section>

    </main>


    <!-- Footer -->

    <div id="footer-placeholder"></div>
    <script src="script.js"></script>

</body>

</html>
